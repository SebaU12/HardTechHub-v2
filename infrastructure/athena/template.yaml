AWSTemplateFormatVersion: "2010-09-09"
Description: HardTech Hub Athena workgroup and least-privilege query policy.

Parameters:
  DataLakeBucket:
    Type: String
    Default: hardtech-datalake
  GlueDatabaseName:
    Type: String
    Default: hardtech_analytics
    AllowedPattern: "[a-z0-9_]+"
  AthenaWorkGroupName:
    Type: String
    Default: hardtech-workgroup
    AllowedPattern: "[a-zA-Z0-9._-]+"

Resources:
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Ref AthenaWorkGroupName
      Description: HardTech Hub analytical queries over the Glue Data Catalog.
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 100000000
        EngineVersion:
          SelectedEngineVersion: Athena engine version 3
        ResultConfiguration:
          OutputLocation: !Sub s3://${DataLakeBucket}/athena-results/
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: project
          Value: hardtech-hub
        - Key: phase
          Value: analytics

  AthenaQueryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Run HardTech Athena queries and access only their catalog and S3 paths.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UseHardTechWorkGroup
            Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:StopQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:GetQueryResultsStream
              - athena:GetWorkGroup
              - athena:ListQueryExecutions
            Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroupName}
          - Sid: ReadHardTechCatalog
            Effect: Allow
            Action:
              - glue:GetDatabase
              - glue:GetDatabases
              - glue:GetTable
              - glue:GetTables
              - glue:GetPartition
              - glue:GetPartitions
              - glue:BatchGetPartition
            Resource:
              - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
              - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}
              - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*
          - Sid: InspectDataLakeBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucketMultipartUploads
            Resource: !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}
          - Sid: ListAnalyticalPrefixes
            Effect: Allow
            Action: s3:ListBucket
            Resource: !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}
            Condition:
              StringLike:
                s3:prefix:
                  - raw/events/*
                  - processed/snapshots/*
                  - athena-results/*
          - Sid: ReadAnalyticalData
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}/raw/events/*
              - !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}/processed/snapshots/*
          - Sid: ManageQueryResults
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource: !Sub arn:${AWS::Partition}:s3:::${DataLakeBucket}/athena-results/*

Outputs:
  WorkGroupName:
    Value: !Ref AthenaWorkGroup
  OutputLocation:
    Value: !Sub s3://${DataLakeBucket}/athena-results/
  QueryPolicyArn:
    Description: Attach this policy to the IAM user or role that executes queries.
    Value: !Ref AthenaQueryPolicy
